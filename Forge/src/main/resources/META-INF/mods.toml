modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/MarkusBordihn/BOs-Adaptive-Performance-Tweaks/issues"

[[mods]]
modId = "adaptive_performance_tweaks"
version = "${file.jarVersion}"
displayTest = "IGNORE_SERVER_VERSION"
displayName = "Adaptive Performance Tweaks"
displayURL = "https://curseforge.com/minecraft/mc-mods/adaptive-performance-tweaks"
logoFile = "logo.png"
authors = "Markus Bordihn"
description = '''Server-side optimization mod that adapts load with dynamic spawn limits,
simulation distance, AI throttling, chunk generation throttling, and monitoring tools for
dedicated servers, single-player worlds, and LAN worlds.'''
features = { java_version = "${java_version_range}" }

[[mixins]]
config = "adaptiveperformancetweaks.mixins.json"

[[dependencies.adaptive_performance_tweaks]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.adaptive_performance_tweaks]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
