buildscript {
  String toolkitPluginModule = "client_runtime_interface_toolkit-gradle-plugin-${minecraft_version}"
  String toolkitPluginVersion = '1.1.0'
  File toolkitPluginDirectory = new File(
      System.getProperty('maven.repo.local', "${System.getProperty('user.home')}/.m2/repository"),
      "de/markusbordihn/clientruntimeinterfacetoolkit/${toolkitPluginModule}/${toolkitPluginVersion}")
  ext.clientRuntimeTestPluginAvailable = toolkitPluginDirectory.isDirectory()
  repositories {
    mavenLocal {
      content {
        includeGroup 'de.markusbordihn.clientruntimeinterfacetoolkit'
      }
    }
  }
  dependencies {
    if (clientRuntimeTestPluginAvailable) {
      classpath "de.markusbordihn.clientruntimeinterfacetoolkit:${toolkitPluginModule}:${toolkitPluginVersion}"
    }
  }
}

plugins {
  id 'idea'
  id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.8"
}

apply plugin: 'java'

def ghostRefScript = file(findProperty('ghostRefIndex') ?: '')
if (ghostRefScript.exists()) apply from: ghostRefScript

subprojects {

  apply plugin: 'java'

  java.toolchain.languageVersion = JavaLanguageVersion.of(21)
  java.withSourcesJar()
  java.withJavadocJar()

  repositories {
    mavenCentral()
    maven {
      url "https://www.cursemaven.com"
      content {
        includeGroup "curse.maven"
      }
    }
  }

  tasks.register('wrapper', Wrapper) {
    gradleVersion = '8.14.5'
    distributionType = Wrapper.DistributionType.BIN
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
  }

  tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
  }

  tasks.withType(Javadoc).configureEach {
    enabled = false
  }

  tasks.register("prepareKotlinBuildScriptModel") {}
}

tasks.register('allGameTests') {
  group = 'verification'
  description = 'Runs Fabric, Forge, and NeoForge game tests.'
  dependsOn ':Fabric:runGameTest', ':Forge:runGameTestServer', ':NeoForge:runGameTestServer'
}

tasks.register('fullCheck') {
  group = 'verification'
  description = 'Runs the standard checks and Fabric, Forge, and NeoForge game tests.'
  dependsOn 'check', 'allGameTests'
}

if (clientRuntimeTestPluginAvailable) {
  apply plugin: 'de.markusbordihn.clientruntimeinterfacetoolkit.client-test'
  apply from: 'gradle/tasks/clientTest.gradle'
}
